name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [14, 16, 18, 20, 22, 24] # removed latest, for now
        coverage: [true]
        include:
          - os: ubuntu-latest
            node-version: 12
            coverage: false
          - os: windows-latest
            node-version: 12
            coverage: false
        exclude:
          # macos-latest is now ARM, so exclude Node 12/14
          - os: macos-latest
            node-version: 14
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      NODE: ${{ matrix.node-version }}

    name: Test on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - run: npm ci
        if: ${{ github.event_name != 'schedule' }}

      - shell: bash
        run: |
          rm package-lock.json
          npx --yes "$(jq -r '.packageManager | split("+")[0]' package.json)" install
        if: ${{ github.event_name == 'schedule' }}

      - run: npm run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - run: npm run test
        if: ${{ ! matrix.coverage }}

      - run: npm run coverage
        if: ${{ matrix.coverage }}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ matrix.coverage && github.event_name != 'schedule' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          env_vars: OS,NODE
          disable_search: true
          files: ./coverage/codecov.json

  lint:
    name: lint
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'schedule' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run lint

  dprint:
    name: dprint
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'schedule' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npx dprint check

  check-latest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: Check latest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm pack

      - run: npm install -g hereby

      - run: |
          set -exo pipefail
          WORKSPACE=$PWD
          cd $(mktemp -d)
          npm init -y
          npm install $WORKSPACE/*.tgz

          cp $WORKSPACE/dist/__tests__/cli/__fixtures__/Herebyfile.mjs .

          hereby --tasks
        name: Verify that latest hereby can run local hereby

      - run: |
          set -exo pipefail
          WORKSPACE=$PWD
          cd $(mktemp -d)
          npm init -y
          npm install hereby

          cp $WORKSPACE/dist/__tests__/cli/__fixtures__/Herebyfile.mjs .

          node $WORKSPACE/bin/hereby.js --tasks
        name: Verify that local hereby can run latest hereby

  required:
    runs-on: ubuntu-slim
    if: ${{ always() }}
    needs:
      - test
      - lint
      - dprint
      - check-latest

    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          ! echo $NEEDS | jq -e 'to_entries[] | { job: .key, result: .value.result } | select(.result == "success" or .result == "skipped" | not)'
